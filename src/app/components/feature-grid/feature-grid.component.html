<section class="features">
  <div class="section-heading">
    <h2>Architect Your Imagination</h2>
    <p>Precision tools for the next generation of persona creation.</p>
  </div>

  <div class="feature-grid">
    <article *ngFor="let feature of features">
      <span></span>
      <h3>{{ feature.title }}</h3>
      <p>{{ feature.text }}</p>
    </article>
  </div>
</section>
