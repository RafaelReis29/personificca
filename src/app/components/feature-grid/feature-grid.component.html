<section class="features">
  <div class="section-heading">
    <h2>Built for the essentials</h2>
    <p>A compact workflow for creating and managing personas.</p>
  </div>

  <div class="feature-grid">
    <article *ngFor="let feature of features">
      <span></span>
      <h3>{{ feature.title }}</h3>
      <p>{{ feature.text }}</p>
    </article>
  </div>
</section>
